const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

function card(x) {
  return `<article class="card">
    <div class="hero">${esc(x.hero)} <span class="badge">COUNTER</span></div>
    <div class="row"><div class="label">Herói</div><div class="value">${esc(x.counter)}</div></div>
    <div class="row"><div class="label">Por que é counter</div><div class="text">${esc(x.why)}</div></div>
    <div class="row"><div class="label">Item recomendado</div><div class="value">${esc(x.item)}</div></div>
    <div class="row"><div class="label">Por que o item funciona</div><div class="text">${esc(x.itemwhy)}</div></div>
  </article>`;
}
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render() {
  const q = norm(document.getElementById('search').value.trim());
  const result = heroes.filter(x => !q || [x.hero,x.counter,x.item].some(v => norm(v).includes(q)));
  document.getElementById('count').textContent = `${result.length} resultado${result.length===1?'':'s'}`;
  document.getElementById('grid').innerHTML = result.length ? result.map(card).join('') :
    `<div class="empty" style="grid-column:1/-1">Nenhum resultado encontrado.<br>Experimente outro nome.</div>`;
}
document.getElementById('search').addEventListener('input', render);
render();
</script>
